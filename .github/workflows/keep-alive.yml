name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 10 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -f \
            "https://ckherajvnmnuhylnbwwk.supabase.co/rest/v1/clientes?select=id&limit=1" \
            -H "apikey: sb_publishable_Nme3TB6O-YmYNYVBMvH52Q_X7Em9dE8" \
            -H "Authorization: Bearer sb_publishable_Nme3TB6O-YmYNYVBMvH52Q_X7Em9dE8"
          echo "Supabase pingado!"
      - name: Keep workflow active
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-alive.yml --repo ${{ github.repository }}
